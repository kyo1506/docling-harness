[project]
name = "docling-harness"
version = "0.1.0"
description = "CLI tool to extract, classify, and consolidate documentation into agent-ready context"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0",
    "docling-core>=2.0",
    "openai>=1.0",
    "token-count>=0.2",
    "tiktoken",
    "httpx>=0.27",
]

[project.scripts]
harness = "docling_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
