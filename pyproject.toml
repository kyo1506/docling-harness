[project]
name = "docling-harness"
version = "0.1.0"
description = "CLI tool to extract, classify, and consolidate documentation into agent-ready context"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.121.0",
    "docling-core>=2.92.0",
    "openai>=3.3.1",
    "token-count>=0.2.1",
    "tiktoken>=0.14.0",
    "httpx>=0.28.1",
]

[project.scripts]
harness = "docling_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
